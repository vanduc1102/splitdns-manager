name: Release

# Push a tag such as v1.2.3 (or v1.2.3-rc.1 for a pre-release) to build, sign, notarize and publish.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: true
    secrets: inherit

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SplitDNSManager
          path: dist

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          # Publishing a release from the GitHub UI creates the tag, which starts this workflow
          # after the release already exists, so attach the assets to it instead of failing.
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "The release $TAG already exists, so its title and notes are kept and the assets are replaced."
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --title "SplitDNS Manager $VERSION" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
